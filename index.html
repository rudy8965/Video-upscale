<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upscale Video</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #a78bfa; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; }
    .box {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 30px 20px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .box:hover { border-color: #a78bfa; }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    select { background: #222; color: #eee; }
    button {
      background: #7c5cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 16px; color: #a78bfa; min-height: 24px; }
    a { color: #34d399; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎬 Upscale Video</h1>
  <p>Naikkan resolusi ke 2K / 4K<br>Max 50 MB • Video pendek</p>

  <div class="box" onclick="document.getElementById('file').click()">
    <div id="nama">📁 Pilih / tarik video di sini</div>
  </div>
  <input type="file" id="file" accept="video/*" hidden>

  <select id="res">
    <option value="4k">4K (2160×3840)</option>
    <option value="2k">2K (1440×2560)</option>
    <option value="1080p">1080p</option>
  </select>

  <button id="btn" disabled>Mulai Upscale</button>
  <div id="status"></div>

<script>
const fileInput = document.getElementById('file');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const nama = document.getElementById('nama');
let file = null;

fileInput.onchange = () => {
  file = fileInput.files[0];
  if (file) {
    nama.textContent = file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)';
    btn.disabled = false;
  }
};

btn.onclick = async () => {
  if (!file) return;
  btn.disabled = true;
  status.textContent = '⏳ Sedang diproses... tunggu 20-60 detik';

  const form = new FormData();
  form.append('video', file);
  form.append('res', document.getElementById('res').value);

  try {
    const res = await fetch('/upscale', { method: 'POST', body: form });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Gagal');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    status.innerHTML = '✅ Selesai! <a href="' + url + '" download="upscaled.mp4">Download di sini</a>';
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
  btn.disabled = false;
};
</script>
</body>
</html>
